# Builds the Windows installer on GitHub so the app can be installed without a local toolchain.
# - Push to main: the installer is a workflow artifact (Actions → this run → Artifacts).
# - Push a version tag (`v0.11.0`): the same build is also published as a GitHub Release, where
#   the setup .exe can be downloaded directly, without a zip or a GitHub login.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Path filters below do not apply to tags: a version tag always builds and releases.
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # creating the release on version tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: niagara-scheduler-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes = this version's section of docs/CHANGES.md.
          awk -v v="## ${TAG}" 'index($0, v) == 1 {on=1; next} /^## v/ {on=0} on' docs/CHANGES.md > notes.md
          gh release create "$TAG" src-tauri/target/release/bundle/nsis/*-setup.exe \
            --title "Niagara Scheduler ${TAG}" --notes-file notes.md
