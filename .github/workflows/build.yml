# Builds the Windows installer on GitHub so the app can be installed without a local toolchain.
# - Push to main: the installer is a workflow artifact (Actions → this run → Artifacts).
# - Push a version tag (`v0.11.0`): the same build is also published as a GitHub Release, where
#   the setup .exe can be downloaded directly, without a zip or a GitHub login, together with its
#   signature and latest.json for the app's built-in updater (needs the TAURI_SIGNING_* secrets).
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Path filters below do not apply to tags: a version tag always builds and releases.
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # creating the release on version tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npx tauri build
        env:
          # Signs the update files (the app only installs updates signed with this key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: niagara-scheduler-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes = this version's section of docs/CHANGES.md.
          awk -v v="## ${TAG}" 'index($0, v) == 1 {on=1; next} /^## v/ {on=0} on' docs/CHANGES.md > notes.md
          # One installer without spaces in its name, its signature, and latest.json, which the
          # app's updater reads from releases/latest/download/latest.json.
          src=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          name="Niagara-Scheduler_${TAG#v}_x64-setup.exe"
          mkdir -p out && cp "$src" "out/$name" && cp "$src.sig" "out/$name.sig"
          node -e '
            const fs = require("fs");
            const [tag, name, repo] = process.argv.slice(1);
            const notes = fs.readFileSync("notes.md", "utf8").trim();
            fs.writeFileSync("out/latest.json", JSON.stringify({
              version: tag.replace(/^v/, ""),
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(`out/${name}.sig`, "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/${tag}/${name}`,
              } },
            }, null, 2));
          ' "$TAG" "$name" "$GITHUB_REPOSITORY"
          gh release create "$TAG" "out/$name" "out/$name.sig" out/latest.json \
            --title "Niagara Scheduler ${TAG}" --notes-file notes.md
